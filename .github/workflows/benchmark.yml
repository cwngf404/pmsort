name: Apple Silicon

on:
  workflow_dispatch: # Adds a manual "Run workflow" button in the Actions tab

jobs:
  apple-silicon-bench:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Print Apple Silicon Info
        run: |
          sysctl -n machdep.cpu.brand_string
          g++ --version

      - name: Copy, Compile & Run
        run: |
          mkdir -p src
          cp bench/bench.cpp src/bench.cpp
          g++++ -O3 -march=native -std=c++20 src/bench.cpp -o src/bench
          ./src/bench
